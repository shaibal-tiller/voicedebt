name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 1. Clean and regenerate modern Android scaffolding
      - name: Recreate Clean Android Scaffold
        run: |
          rm -rf android
          flutter create --org com.voicedebt --project-name voicedebt --platforms=android .

      # 2. Inject microphone permissions into AndroidManifest.xml
      - name: Inject Microphone Permissions & Speech Queries
        run: |
          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              c = f.read()
          perms = '''    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <queries>
                  <intent>
                      <action android:name=\"android.speech.RecognitionService\" />
                  </intent>
              </queries>
          '''
          c = c.replace('<application', perms + '    <application')
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(c)
          "

      # 3. Patch CardThemeData and dollar sign escapes in lib/main.dart
      - name: Patch Dart Syntax
        run: |
          python3 -c "
          with open('lib/main.dart', 'r') as f:
              code = f.read()

          # Fix CardTheme to CardThemeData
          code = code.replace('cardTheme: CardTheme(', 'cardTheme: CardThemeData(')

          # Fix NumberFormat symbol to raw string r'$'
          code = code.replace(\"symbol: '\$'\", \"symbol: r'\$'\")

          # Fix labelText Amount ($)
          code = code.replace(\"labelText: 'Amount (\$)'\", \"labelText: r'Amount (\$)'\")

          # Fix unescaped literal dollar signs before variables
          code = code.replace('• \$\$', '• \\\$')
          code = code.replace(': \$\$', ': \\\$')
          code = code.replace('Remove \$\$', 'Remove \\\$')

          with open('lib/main.dart', 'w') as f:
              f.write(code)
          "

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voicedebt-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
